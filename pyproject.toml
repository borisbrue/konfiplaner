[project]
name = "konfiplaner"
version = "0.1.0"
description = "Personen zu Terminen zusammenstellen"
requires-python = ">=3.11"
dependencies = ["ortools", "openpyxl", "PySide6", "pyyaml", "jsonschema"]

[project.scripts]
konfiplaner = "konfiplaner.gui.app:main"

[dependency-groups]
dev = ["pytest", "pytest-qt", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["konfiplaner"]

[tool.pytest.ini_options]
markers = ["performance: langsame Performance-Tests (uv run pytest -m performance)"]
addopts = "-m 'not performance'"

[tool.ruff]
line-length = 110
