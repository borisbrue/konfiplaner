name: macOS-App

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write   # Release anlegen

jobs:
  app:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14        # Apple Silicon
            arch: arm64
          - runner: macos-15-intel  # Intel
            arch: intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --group dev
      - name: Tag und Version müssen übereinstimmen
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(uv run python -c "from konfiplaner.update import eigene_version; print(eigene_version())")
          test "v$version" = "$GITHUB_REF_NAME" || { echo "Tag $GITHUB_REF_NAME passt nicht zu pyproject-Version $version"; exit 1; }
      - run: uv run pytest -q
        env:
          QT_QPA_PLATFORM: offscreen
      - name: App bauen
        run: |
          uv run --with pyinstaller pyinstaller --noconfirm --windowed --name KonfiPlaner \
            --osx-bundle-identifier de.borisbrue.konfiplaner \
            --copy-metadata konfiplaner --collect-data konfiplaner --collect-data docx --collect-all ortools \
            packaging/start.py
          codesign --force --deep --sign - dist/KonfiPlaner.app
          ditto -c -k --keepParent dist/KonfiPlaner.app KonfiPlaner-macos-${{ matrix.arch }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: KonfiPlaner-macos-${{ matrix.arch }}
          path: KonfiPlaner-macos-${{ matrix.arch }}.zip

  release:
    needs: app
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: KonfiPlaner-macos-*
          merge-multiple: true
      - name: Release anlegen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" KonfiPlaner-macos-*.zip --repo "$GITHUB_REPOSITORY" \
            --title "KonfiPlaner ${GITHUB_REF_NAME#v} (macOS)" \
            --notes "macOS-App: KonfiPlaner-macos-arm64.zip für Apple Silicon (M1 oder neuer), KonfiPlaner-macos-intel.zip für Intel-Macs. Entpacken, beim ersten Start Rechtsklick → Öffnen (nicht notarisiert), oder im Terminal: xattr -dr com.apple.quarantine KonfiPlaner.app"
