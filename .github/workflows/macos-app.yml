name: macOS-App

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  app:
    runs-on: macos-14   # Apple Silicon (arm64)
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --group dev
      - run: uv run pytest -q
        env:
          QT_QPA_PLATFORM: offscreen
      - name: App bauen
        run: |
          uv run --with pyinstaller pyinstaller --noconfirm --windowed --name KonfiPlaner \
            --osx-bundle-identifier de.borisbrue.konfiplaner \
            --collect-data konfiplaner --collect-all ortools \
            packaging/start.py
          codesign --force --deep --sign - dist/KonfiPlaner.app
          ditto -c -k --keepParent dist/KonfiPlaner.app KonfiPlaner-macos.zip
      - uses: actions/upload-artifact@v4
        with:
          name: KonfiPlaner-macos
          path: KonfiPlaner-macos.zip
